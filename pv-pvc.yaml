    path: "/mnt/test-wordpress"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-wordpress-pvc
  namespace: test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---

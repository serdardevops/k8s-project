# pv-pvc.yaml
# Test namespace için
apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-mysql-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/test-mysql"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-mysql-pvc
  namespace: test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
